<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    *{
        margin:0;
        padding:0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;

    }
    body{
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .dropdown{
        display:relative;
        display: inline-block;
        margin-top:50px;
    }
    .dropdown{
        background-color: white;
        color: aliceblue;
        padding: 10%  40px;
        font-size: 16px;
        border:none;
        cursor: pointer;
    }
    .dropdown-content{
        display: none;
        position: absolute;
        background-color:aquamarine;
        min-width:160px;
        box-shadow: 0px  8px 16px 0px rgba( 0,0,0,0.2);
        z-index:1;
    }
    .dropdown-content a {
        color:black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
    }
    .dropdown-content   a:hover{
        background-color: #f1f1f1;

     }
     .dropdown:hover  .dropdown-content{
        display: block;
     }


     </style>
</head>
<body>
    <div class="dropdown">
        <button class="dropbtn">dropdown</button>
  <div class ="dropdown-content">
      <a href="#">link  1</a>
      <a href="#">link  2</a>
      <a href="#">link  3</a>
  </div>
    </div>
</body>   
</html>
