<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: black;
        }
        div{
            height: 200px;
            width: 200px;
            display: inline-block;
            background: blue;
            margin: 20px;
        }
        .box1{
            transform: translate(50px, 20px);
        }
        .box2{
            transform: translate(40px);
        }
        .box3{
            transform: translate(30px);
        }
        .box4{
            transform: rotate(50deg);
        }
        .box5{
            transform: scale(1.1);
        }
        .box6{
            transform: scale(1.5);
        }
        .box7{
            transform:scale(1.5) ;
        }
        .box8{
            transform: skew(30deg, 20deg);
        }
        .box9{
            transform: skewx(30deg);
        }
        .box10{
            transform: skewY(20deg);
        }
        .box11{
            transform: matrix(1,0.2,0.2,1,50,30);
        }
        
    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box5"></div>
    <div class="box6"></div>
    <div class="box7"></div>
    <div class="box8"></div>
    <div class="box9"></div>
    <div class="box10"></div>
    
</body>
</html>
